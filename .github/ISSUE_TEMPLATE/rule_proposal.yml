name: Compatibility rule proposal
description: Propose an evidence-backed Stellar compatibility check
title: "rule: "
body:
  - type: input
    id: rule_id
    attributes:
      label: Rule ID or descriptive name
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Affected integrations and versions
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Authoritative references
    validations:
      required: true
  - type: textarea
    id: fixtures
    attributes:
      label: Positive and intentional/negative examples
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: False-positive risks and confidence
    validations:
      required: true
